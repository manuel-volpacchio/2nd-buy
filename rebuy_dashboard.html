      <div class="panel-body">
        <div class="row2">
          <div><b style="font-size:12.5px">Con vs sin interacción CS en trip1</b><div id="csChart"></div></div>
          <div><b style="font-size:12.5px">Por satisfacción declarada (solo con interacción)</b><div id="csSatChart"></div></div>
        </div>
      </div>
    </section>

    <section class="panel" id="path">
      <div class="panel-head"><h2>Path de medios de trip1</h2><span class="desc">Solo cohortes 2021+ (0% cobertura antes)</span></div>
      <div class="panel-body">
        <b style="font-size:12.5px">Canal dominante del path completo</b>
        <div id="pathChart"></div>
        <div class="row2" style="margin-top:18px;">
          <div><b style="font-size:12.5px">Canal del primer click (first-touch)</b><div id="firstClickChart"></div></div>
          <div><b style="font-size:12.5px">Canal del último click antes de comprar (last-touch)</b><div id="lastClickChart"></div></div>
        </div>
        <div style="margin-top:18px;">
          <b style="font-size:12.5px">¿El primer y el último click fueron del mismo canal?</b>
          <div id="sameChannelChart"></div>
          <p class="chart-caption">Usuarios cuyo primer y último touchpoint fueron canales distintos (journey multi-touch) muestran más recompra que quienes tuvieron el mismo canal de punta a punta — consistente con el patrón general de "más señales de engagement en trip1 → más recompra" (ver también nº de transacciones y visitas de App).</p>
        </div>
        <div class="caveat">first_click / last_click representan el primer y último click <b>dentro del path de atribución de esa transacción</b> (modelo de atribución interno), no necesariamente la primera o última interacción histórica del usuario con Despegar. Mismo problema de cobertura que eventos_*: no se usan como feature del modelo por el mismo riesgo de confusión con año de cohorte (0% de cobertura en 2019-2020).</div>
      </div>
    </section>

    <section class="panel" id="modelo">
      <div class="panel-head"><h2>Modelo multivariado y ranking de drivers</h2><span class="desc">Regresión logística + Gradient Boosting, evaluados out-of-time — solo features Grupo A</span></div>
      <div class="panel-body">
        <div id="modeloKpis"></div>
        <div class="row2" style="margin-top:16px;">
          <div><b style="font-size:12.5px">Lift por decil de score (GBM, test set)</b><div id="liftChart"></div></div>
          <div><b style="font-size:12.5px">Calibración (predicho vs observado)</b><div id="calibChart"></div></div>
        </div>
        <div class="row2" style="margin-top:16px;">
          <div>
            <b style="font-size:12.5px">Odds ratios — regresión logística (IC95% por bootstrap)</b>
            <table><thead><tr><th>Variable</th><th class="num">OR</th><th class="num">IC95%</th><th class="num">Signif.</th></tr></thead><tbody id="orTableBody"></tbody></table>
          </div>
          <div><b style="font-size:12.5px">Importancia por permutación (GBM)</b><div id="shapChart"></div></div>
        </div>
        <div style="margin-top:16px;">
          <b style="font-size:12.5px">Partial dependence: visitas App antes de trip1 → P(recompra 18m)</b>
          <div id="pdpChart"></div>
        </div>
        <div class="caveat">OR &gt; 1 con IC95% que no cruza 1 = asociación positiva robusta dentro del modelo (controlando por las demás variables). El poder predictivo global es moderado (ver ROC-AUC): el comportamiento en trip1 ayuda pero está lejos de determinar la recompra.</div>
      </div>
    </section>

    <section class="panel" id="limitaciones">
      <div class="panel-head"><h2>Limitaciones y variables no utilizables</h2></div>
      <div class="panel-body">
        <ul class="insight-list">
          <li><b>Nunca se usaron como features predictivas</b> (Grupo C, leakage directo): cantidad_visitas/searches_entre_trips, flg_app_entre_trips, plataforma/canal/productos de trip2, flg_mismo_producto_trip_1_2.</li>
          <li><b>flg_app_90d_post_trip1 está contaminada</b> para el 31.5% de los recompradores (recompraron antes de los 90 días) — no se usó en el modelo principal.</li>
          <li><b>Customer Service</b> no tiene timestamp de la interacción en el export: se trata como descriptivo, nunca como predictor, y solo se mira en cohortes 2024+ por su cobertura.</li>
          <li><b>CRM histórico</b> (envíos/opens/clicks) no está incorporado — cobertura de mkt_users_fact_comms en revisión según la documentación del pipeline. eventos_crm es solo el path de atribución de la compra, no el historial de comunicaciones.</li>
          <li><b>Margin/NPV</b> 100% NULL en 2019 — excluido de comparaciones que incluyan esa cohorte.</li>
          <li><b>Path de medios / first-last click</b> con 0% de cobertura en 2019-2020 — todos los cortes por canal de atribución se restringen a 2021+.</li>
          <li><b>~3.427 usuarios (0.03%)</b> perdieron su fila de trip1 por errores de parseo de CSV (campos con comas sin escapar, ej. nombres de banco) — se excluyeron de todos los cortes descriptivos y del modelo.</li>
        </ul>
      </div>
    </section>
    </div>
  `;

  buildKpis();
  buildCalidad();
  buildInsights();
  buildRecomendaciones();
  buildSegmentExplorer();
  buildCohortes();
  buildCohortesPaisPuntos();
  buildExploradorCohortes();
  buildSurvival();
  buildLegacy();
  buildPerfil();
  buildApp();
  buildLoyalty();
  buildPayments();
  buildCS();
  buildPath();
  buildModelo();
  buildEjecutivo();
}

document.getElementById('darkToggle').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  if (DATA) {
    buildSegmentExplorer(); buildCohortes(); buildCohortesPaisPuntos(); buildExploradorCohortes(); buildSurvival(); buildLegacy(); buildPerfil();
    buildApp(); buildLoyalty(); buildPayments(); buildCS(); buildPath(); buildModelo(); buildEjecutivo();
  }
});

init().catch(err => { document.getElementById('app').innerHTML = '<div class="loading">Error cargando datos: '+err.message+'</div>'; console.error(err); });

document.querySelectorAll('nav.maintabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.maintabs button').forEach(b => b.classList.toggle('active', b===btn));
    document.querySelectorAll('.tab-page').forEach(p => p.classList.toggle('active', p.id === 'tabpage-' + btn.dataset.tab));
    const toc = document.getElementById('detalleToc');
    if (toc) toc.style.display = btn.dataset.tab === 'detalle' ? 'flex' : 'none';
    window.scrollTo({top:0, behavior:'instant'});
    // Los graficos SVG se dimensionan segun clientWidth del contenedor en el momento de
    // dibujarse; si esa solapa estaba oculta (display:none) el ancho medido era 0 y quedaban
    // con tamanos raros. Al volver a mostrar "detalle" los re-dibujamos con el ancho real.
    if (btn.dataset.tab === 'detalle' && DATA) {
      buildSegmentExplorer(); buildCohortes(); buildCohortesPaisPuntos(); buildExploradorCohortes(); buildSurvival(); buildLegacy(); buildPerfil();
      buildApp(); buildLoyalty(); buildPayments(); buildCS(); buildPath(); buildModelo();
    }
    if (btn.dataset.tab === 'ejecutivo' && DATA) { buildEjecutivo(); }
  });
});
</script>
</body>
</html>
